{% extends 'showcase/base.html' %}{% block content %}<div class="login-layout"><span class="eyebrow">Course administration</span><h1>Staff login</h1><p>Manage projects, reviews and voting.</p>{% if who %}<p class="note">Signing in as Staff will sign out your student account in this browser.</p>{% endif %}<form method="post" class="panel">{% csrf_token %}<label>Username<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Log in</button></form><p><a href="{% url 'showcase:login' %}">Student login →</a></p></div>{% endblock %}
